; PlatformIO project for the DIY iPod-Classic-style MP3 player
; See docs/SPEC.md for the full functional/technical spec.

[env:esp32wrover]
platform = espressif32
; Generic ESP32-WROVER-B devboard, not Espressif's own WROVER-KIT (that board
; def assumes WROVER-KIT's onboard LCD/JTAG wiring, which we don't have).
board = esp32dev
framework = arduino

; ESP32-WROVER-B (N4): 4MB flash, 4MB PSRAM
board_build.partitions = default.csv
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed = 921600

; Libraries are added one at a time as each bring-up step (docs/SPEC.md
; section 4) actually starts using them, not all up front -- keeps builds
; fast and avoids resolving/downloading things we don't need yet.
; SD/SPI (steps 1-2) are built into the ESP32 Arduino core, no entry needed.
;
; Anticipated additions, by step:
;   step 3 (PCM5102A playback): https://github.com/schreibfaul1/ESP32-audioI2S.git
;   step 4 (display):           https://github.com/Bodmer/TFT_eSPI.git
;                                https://github.com/Bodmer/TJpg_Decoder.git
;   step 5 (Bluetooth):         https://github.com/pschatzmann/ESP32-A2DP.git
;   step 6 (ANO input):         https://github.com/thomasfredericks/Bounce2.git
;   step 7 (battery):           https://github.com/adafruit/Adafruit_MAX1704X.git
;                                https://github.com/adafruit/Adafruit_BusIO.git
lib_deps =
