; PlatformIO project for the DIY iPod-Classic-style MP3 player
; See docs/SPEC.md for the full functional/technical spec.

[env:esp32wrover]
platform = espressif32
; Generic ESP32-WROVER-B devboard, not Espressif's own WROVER-KIT (that board
; def assumes WROVER-KIT's onboard LCD/JTAG wiring, which we don't have).
board = esp32dev
framework = arduino

; ESP32-WROVER-B (N4): 4MB flash, 4MB PSRAM
; huge_app.csv, not default.csv: default's dual-OTA-slot scheme only gives
; ~1.25MB per app slot, and the classic BT stack (step 5) pushed the build
; past that (1.72MB). We don't need OTA or much SPIFFS space -- music lives
; on the SD card, not internal flash -- so a single ~3MB app partition is
; the right tradeoff here.
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
; The framework's default C++ standard (whatever it resolves to on this
; toolchain) rejected aggregate-initializing structs that have default
; member initializers (e.g. `bool paired = false;`) -- that's a C++14
; feature (relaxed aggregate init), not available pre-C++14. Explicit
; override needed; build_unflags first since the framework's own -std
; flag is otherwise appended after ours and wins. GCC 8.4 (this
; toolchain) fully supports C++17, so this is safe -- distinct from the
; C++20 std::span issue noted below for ESP32-audioI2S, which really
; isn't available on this toolchain at all.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    ; TFT_eSPI compile-time config (step 4 display), set via build flags
    ; rather than editing the library's User_Setup.h -- that file would get
    ; clobbered on every library reinstall/update. Pins match src/config/Pins.h.
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=40000000

monitor_speed = 115200
; Was 921600 -- first real upload attempt failed right after the baud-rate
; step-up ("Unable to verify flash chip connection (No serial data
; received.)"), the classic symptom of the actual USB-serial link (not a
; devboard's onboard USB chip here) not keeping up with that speed.
; Dropped to a safer rate; bump back up later if flashing is reliable and
; faster uploads are worth it.
upload_speed = 115200

; Libraries are added one at a time as each bring-up step (docs/SPEC.md
; section 4) actually starts using them, not all up front -- keeps builds
; fast and avoids resolving/downloading things we don't need yet.
; SD/SPI (steps 1-2) are built into the ESP32 Arduino core, no entry needed.
;
; Anticipated additions, by step:
;   step 4 (display):           https://github.com/Bodmer/TJpg_Decoder.git (album art, not needed yet)
;   step 7 (battery):           https://github.com/adafruit/Adafruit_MAX1704X.git
;                                https://github.com/adafruit/Adafruit_BusIO.git
; Note: step 6 (ANO input) done ahead of step 5 (Bluetooth) -- no dependency
; between them, reordered since the wiring was already in hand.
lib_deps =
    ; Pinned to 3.0.12, not the default branch: versions 3.1+ use std::span
    ; in their PSRAM allocator code, which needs C++20/GCC10+. This
    ; platform's Arduino framework toolchain is GCC 8.4, which doesn't have
    ; <span> at all -- fails to compile regardless of -std flags. 3.0.12
    ; predates that PSRAM refactor and builds clean on this toolchain.
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    https://github.com/Bodmer/TFT_eSPI.git
    https://github.com/thomasfredericks/Bounce2.git
    ; Classic BT (A2DP source), step 5. NOTE: the classic BT stack is a
    ; sizable chunk of flash on top of everything else already in this
    ; build -- if this overflows the default.csv partition scheme's app
    ; slot (~1.25MB), switch board_build.partitions to a scheme with a
    ; bigger single app partition (e.g. huge_app.csv).
    https://github.com/pschatzmann/ESP32-A2DP.git
    ; MAX17048 fuel gauge, step 7.
    https://github.com/adafruit/Adafruit_MAX1704X.git
    https://github.com/adafruit/Adafruit_BusIO.git
